# Hybrid development stack: Caddy and imgproxy run in Docker, while godam
# (go run) and Vite run on the host for fast iteration and HMR.
#
#   make dev-stack   # start Caddy + imgproxy
#   make dev         # start godam + Vite on the host
#
# This file is not for a full-stack deployment; use docker-compose.yml alone
# for that.
services:
  caddy:
    environment:
      # localhost uses Caddy's local CA automatically; this also makes
      # .test/.internal domains work in development.
      CADDY_GLOBAL_OPTIONS: local_certs
      GODAM_APP_UPSTREAM: host.docker.internal:5174
      GODAM_ASSET_UPSTREAM: host.docker.internal:8080
      GODAM_CONVERSION_ROOT: /srv/dev-conversions
      GODAM_DELIVERY_CACHE_TTL: ${GODAM_DELIVERY_CACHE_TTL:-86400}
      GODAM_SOURCE_ROOT: /srv/host-assets/uploads
    volumes:
      - ./docker/caddy-entrypoint.sh:/usr/local/bin/godam-caddy-entrypoint.sh:ro
      # Host godam writes conversions here (GODAM_CONVERSION_DIR).
      - ./.dev/conversions:/srv/dev-conversions
      # Read-only view of the host asset storage used for /src delivery.
      - ${GODAM_HOST_STORAGE_DIR:-./.dev/storage}:/srv/host-assets:ro

  imgproxy:
    environment:
      IMGPROXY_ALLOWED_SOURCES: http://host.docker.internal:8080/
    ports:
      # Only host-run godam needs to reach imgproxy; not published publicly.
      - "127.0.0.1:8081:8080"
